<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enhancer</title>
<meta name="description" content="Sharpen, clean up and colour-grade video in your browser. Nothing is uploaded.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0d; --text:#ddd7cd; --muted:#a39d92; --line:#5a554c;
  --track:#34312b; --accent:#ff6a1a; --dot:#c4511a;
  --serif:'Playfair Display',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 56px}

/* header: everything centred, language pill top right (as MiSE) */
header{position:relative;text-align:center;padding-top:64px;margin-bottom:36px}
.lang{position:absolute;top:18px;right:0;z-index:20;display:flex;
  background:#151412;border:1px solid #2a2724;border-radius:999px;padding:3px}
.lang button{background:none;border:0;color:#8d867e;font:400 11px var(--mono);
  letter-spacing:.1em;padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--accent);color:#120a04;font-weight:700}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin:0 0 14px;padding-left:.18em}
h1{font:700 clamp(36px,7vw,68px)/1.05 var(--serif);letter-spacing:-.01em;
  margin:0;color:var(--text)}
.sub{color:var(--muted);max-width:34ch;margin:20px auto 0;font-size:13.5px}

/* cards */
.card{display:block;border:1px solid var(--line);border-radius:28px;
  padding:26px 24px;margin:0 0 16px}
.name{font:700 22px/1.3 var(--serif);color:var(--accent)}
.desc{color:var(--muted);font-size:14px}
h3{margin:0 0 22px;font-weight:400;line-height:1.7}
.drop{cursor:pointer;transition:border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop .name{font-size:24px}
input[type=file]{display:none}

/* section label like "OTHER PROJECTS" */
.eyebrow{text-align:center;font:400 12px var(--mono);letter-spacing:.3em;
  text-transform:uppercase;color:var(--muted);margin:34px 0 14px;padding-left:.3em}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.center{justify-content:center}
.chip{background:none;border:1px solid var(--line);color:#cfc8bc;
  font:400 13px var(--mono);padding:9px 16px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(255,106,26,.1)}
.chip.pre{color:var(--accent)}
.chips.grid{display:grid;grid-template-columns:1fr 1fr}
.chips.grid .chip{text-align:center;padding:12px 10px}

/* preview */
#stage{display:none}
.player{position:relative;background:#000;border-radius:20px;overflow:hidden;
  border:1px solid var(--line)}
.player video{display:block;width:100%;max-height:60vh;background:#000}
.fx{position:absolute;inset:0;pointer-events:none}
#warmFx{mix-blend-mode:soft-light;opacity:0}
#grainFx{mix-blend-mode:overlay;opacity:0;background-size:256px 256px;
  animation:grain .6s steps(4) infinite}
@keyframes grain{
  0%{background-position:0 0}25%{background-position:-64px 40px}
  50%{background-position:30px -80px}75%{background-position:-40px -20px}
  100%{background-position:0 0}}
.player.orig video{filter:none!important}
.player.orig .fx{display:none}
.bar{display:flex;flex-direction:column;align-items:center;gap:14px;margin:16px 0 0}
.meta{color:var(--muted);font-size:12px;text-align:center;word-break:break-word}
.hold{touch-action:none;user-select:none;-webkit-user-select:none}
.note{color:var(--muted);font-size:12px;text-align:center;margin:14px auto 0;max-width:40ch}

/* sliders */
.row{margin:0 0 20px}
.row:last-child{margin-bottom:0}
.row label,.row .lab{display:flex;justify-content:space-between;font-size:13px;
  color:var(--muted);margin-bottom:8px}
.row output{color:var(--text)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;
  background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--track)}
input[type=range]::-moz-range-track{height:2px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
  border-radius:50%;background:var(--accent);margin-top:-9px;border:0}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
  background:var(--accent);border:0}
.toggles{margin-top:20px}

/* actions */
.go{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.btn{display:block;text-align:center;text-decoration:none;cursor:pointer;
  border:1px solid var(--accent);color:var(--accent);background:rgba(255,106,26,.08);
  border-radius:999px;padding:15px;font:700 22px/1.2 var(--serif)}
.btn:hover{background:rgba(255,106,26,.16)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--line);color:var(--muted);background:none;
  font:400 13px var(--mono);padding:12px}
.progress{height:3px;background:var(--track);border-radius:2px;margin-top:18px;
  overflow:hidden;display:none}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#status{color:var(--muted);font-size:13px;margin-top:12px;min-height:20px;text-align:center;
  white-space:pre-line;word-break:break-word}
#status.err{color:#ff8a6a}
#result{display:none;margin-top:28px}
#result video{display:block;width:100%;border-radius:20px;border:1px solid var(--line);
  background:#000;max-height:60vh}
#dl{margin-top:14px}

/* diagnostics */
.banner{border-color:#ff8a6a}
.banner .name{color:#ff8a6a}
.banner .desc{display:block;margin:0 0 18px}
.diag h3{margin-bottom:18px}
#diagOut{white-space:pre-wrap;word-break:break-word;font-size:12px;
  color:var(--muted);margin-top:18px}
#diagOut:empty{display:none}

/* footer: Github chip, name between orange dots, contact chip */
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:60px}
.fchip{display:inline-flex;align-items:center;min-height:40px;color:#cfc8bc;
  text-decoration:none;border:1px solid var(--line);
  border-radius:999px;padding:0 18px;font-size:13px;white-space:nowrap}
.fchip:hover{border-color:var(--accent);color:var(--accent)}
.mid{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.mid i{display:block;width:8px;height:8px;border-radius:50%;background:var(--dot)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" class="on">EN</button>
    <button type="button" data-lang="ru">RU</button>
  </div>
  <div class="kicker" data-i18n="kicker">Video enhancer</div>
  <h1>Enhancer</h1>
  <p class="sub" data-i18n="sub"></p>
</header>

<section class="card banner" id="crash" style="display:none">
  <h3><span class="name" data-i18n="crashName"></span></h3>
  <span class="desc" id="crashBody"></span>
  <div class="chips">
    <button type="button" class="chip pre" id="crashSave" data-i18n="dgSave"></button>
    <button type="button" class="chip" id="crashHide" data-i18n="crashHide"></button>
  </div>
</section>

<label class="card drop" id="drop">
  <span class="name" data-i18n="dropName"></span>
  <span class="desc" data-i18n="dropDesc"></span>
  <input type="file" id="file" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv">
</label>

<div id="stage">
  <div class="player" id="player">
    <video id="vid" controls playsinline muted loop></video>
    <div class="fx" id="warmFx"></div>
    <div class="fx" id="grainFx"></div>
  </div>
  <div class="bar">
    <span class="meta" id="meta"></span>
    <button type="button" class="chip pre hold" id="hold" data-i18n="hold"></button>
  </div>
  <p class="note" data-i18n="previewNote"></p>

  <div class="eyebrow" data-i18n="gPresets"></div>
  <div class="chips center" id="presets"></div>

  <div class="eyebrow" data-i18n="gSettings"></div>

  <section class="card">
    <h3><span class="name" data-i18n="gSize"></span> <span class="desc" data-i18n="gSizeD"></span></h3>
    <div class="row">
      <div class="lab"><span data-i18n="height"></span></div>
      <div class="chips" id="heightChips"></div>
    </div>
    <div class="row">
      <div class="lab"><span data-i18n="fps"></span></div>
      <div class="chips" id="fpsChips"></div>
    </div>
    <div class="row" id="interpRow">
      <div class="lab"><span data-i18n="interp"></span></div>
      <div class="chips" id="interpChips"></div>
    </div>
  </section>

  <section class="card">
    <h3><span class="name" data-i18n="gClean"></span> <span class="desc" data-i18n="gCleanD"></span></h3>
    <div id="sClean"></div>
    <div class="chips toggles" id="tClean"></div>
  </section>

  <section class="card">
    <h3><span class="name" data-i18n="gColour"></span> <span class="desc" data-i18n="gColourD"></span></h3>
    <div id="sColour"></div>
  </section>

  <section class="card">
    <h3><span class="name" data-i18n="gLook"></span> <span class="desc" data-i18n="gLookD"></span></h3>
    <div id="sLook"></div>
  </section>

  <section class="card">
    <h3><span class="name" data-i18n="gOut"></span> <span class="desc" data-i18n="gOutD"></span></h3>
    <div id="sOut"></div>
    <div class="row">
      <div class="lab"><span data-i18n="speed"></span></div>
      <div class="chips" id="speedChips"></div>
    </div>
    <p class="note" data-i18n="speedNote"></p>
  </section>

  <div class="go">
    <button type="button" class="btn" id="run" data-i18n="run"></button>
    <button type="button" class="btn ghost" id="cancel" data-i18n="cancel" style="display:none"></button>
    <button type="button" class="btn ghost" id="reset" data-i18n="reset"></button>
  </div>
  <div class="progress" id="prog"><i id="bar"></i></div>
  <div id="status"></div>

  <div id="result">
    <video id="out" controls playsinline></video>
    <a class="btn" id="dl" data-i18n="download"></a>
  </div>
</div>

<div class="eyebrow" data-i18n="gDiag"></div>
<section class="card diag">
  <h3><span class="name" data-i18n="diagName"></span> <span class="desc" data-i18n="diagDesc"></span></h3>
  <div class="chips grid">
    <button type="button" class="chip pre" id="dgCheck" data-i18n="dgCheck"></button>
    <button type="button" class="chip" id="dgSave" data-i18n="dgSave"></button>
    <button type="button" class="chip" id="dgCopy" data-i18n="dgCopy"></button>
    <button type="button" class="chip" id="dgClear" data-i18n="dgClear"></button>
  </div>
  <div id="diagOut"></div>
</section>

<footer class="foot">
  <a class="fchip" href="https://github.com/imBeyondiDentity/video-enhancer" target="_blank" rel="noopener">Github</a>
  <div class="mid"><i></i><span>Enhancer</span><i></i></div>
  <a class="fchip" href="mailto:imbeyondidentity@gmail.com" data-i18n="contact"></a>
</footer>

</div>

<!-- sharpen filter used by the live preview only -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="sharpen" color-interpolation-filters="sRGB">
    <feConvolveMatrix id="kernel" order="3" preserveAlpha="true"
      kernelMatrix="0 0 0 0 1 0 0 0 0"/>
  </filter>
</svg>

<script>
'use strict';

/* ---------- strings ---------- */
const I18N = {

    dgCopyFail: 'Не получилось скопировать. Скачай отчёт файлом.',

let lang = 'en';
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;

/* ---------- settings (mirrors enhancer.py) ---------- */
const DEFAULTS = {
  height: 0, denoise: 0, deflicker: false, deband: false, fps: 0,
  interp: 'blend', sharpen: 0, contrast: 0, brightness: 0, saturation: 0,
  vibrance: 0, warmth: 0, grain: 0, crf: 18
};
const PRESETS = {
  p_neutral: {},
  p_ai:    { height: 1080, denoise: 2.5, deband: true, sharpen: 0.7,
             contrast: 8, saturation: 6, grain: 4 },
  p_cine:  { denoise: 1.5, deband: true, sharpen: 0.4, contrast: 15,
             saturation: -6, warmth: 12, grain: 10 },
  p_crisp: { denoise: 1.5, sharpen: 1.2, contrast: 10, saturation: 10, vibrance: 20 },
  p_smooth:{ denoise: 1, fps: 60, interp: 'motion', sharpen: 0.3 }
};
const SLIDERS = {
  sClean:  [['denoise', 0, 10, 0.5], ['sharpen', 0, 2, 0.05]],
  sColour: [['contrast', -100, 100, 1], ['brightness', -100, 100, 1],
            ['saturation', -100, 100, 1], ['vibrance', -100, 100, 1],
            ['warmth', -100, 100, 1]],
  sLook:   [['grain', 0, 40, 1]],
  sOut:    [['crf', 14, 28, 1]]
};
const HEIGHTS = [0, 1080, 1440, 2160];
const FPS = [0, 24, 30, 48, 60];
// Browser memory is tight, so "Best" is x264 "fast" with a short look-ahead,
// not "medium" (which ran the tab out of memory).
const SPEEDS = [['fast', 'ultrafast'], ['balanced', 'veryfast'], ['slow', 'fast']];
const SPEED_PARAMS = { fast: 'rc-lookahead=10:ref=2:bframes=2' };

const S = Object.assign({}, DEFAULTS);
let speed = 'veryfast';
const state = { file: null, srcW: 0, srcH: 0, url: null, running: false };

const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ---------- diagnostics: black box, self-check, crash report ---------- */
// The black box saves the state of a run to localStorage every second. If the
// tab dies (usually out of memory) nothing else can run, but the last saved
// state is still there on the next load and becomes CRASHREPORT.txt.
const APP_VERSION = '1.1.0';
const KEY_NOW = 'enhancer-diag-now';
const KEY_CRASH = 'enhancer-diag-crash';
const STALL_SECONDS = 90;

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

const isMobile = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function heapMB() {
  const m = window.performance && performance.memory;
  return m ? { used: Math.round(m.usedJSHeapSize / 1048576),
               limit: Math.round(m.jsHeapSizeLimit / 1048576) } : null;
}

function envInfo() {
  const nav = navigator, conn = nav.connection || {};
  return {
    ua: nav.userAgent,
    platform: (nav.userAgentData && nav.userAgentData.platform) || nav.platform || '?',
    mobile: isMobile(),
    cores: nav.hardwareConcurrency || null,
    deviceMemoryGB: nav.deviceMemory || null,
    screen: `${screen.width}x${screen.height} @${window.devicePixelRatio || 1}`,
    lang: nav.language || '?',
    online: nav.onLine,
    net: conn.effectiveType || null,
    wasm: typeof WebAssembly === 'object',
    worker: typeof Worker === 'function',
    sab: typeof SharedArrayBuffer === 'function',
    isolated: !!window.crossOriginIsolated,
    // A file: path would show the user's folder names, so it is left out.
    page: location.protocol === 'file:'
      ? 'file:// (opened from a file)'
      : `${location.protocol}//${location.host}${location.pathname}`
  };
}

function newSession() {
  return { v: APP_VERSION, started: Date.now(), running: false, stage: 'idle',
           progress: 0, beat: 0, env: envInfo(), run: null, selfCheck: null,
           events: [], mem: [], ff: [], errors: [] };
}

// A record that still says "running" when the page loads again never finished.
const prevSess = lsGet(KEY_NOW);
if (prevSess && prevSess.running) lsSet(KEY_CRASH, prevSess);
let crashed = lsGet(KEY_CRASH);   // stays until it is downloaded or dismissed
let sess = newSession();

function save() { lsSet(KEY_NOW, sess); }

function note(kind, data) {
  const e = { t: Date.now(), k: kind };
  if (data !== undefined) e.d = data;
  sess.events.push(e);
  if (sess.events.length > 80) sess.events.shift();
  save();
}

function stage(name, data) { sess.stage = name; note('stage:' + name, data); }

function fail(where, err) {
  const msg = String((err && err.message) || err || 'unknown');
  const stack = String((err && err.stack) || '').split('\n').slice(0, 5).join('\n');
  sess.errors.push({ t: Date.now(), where, msg: msg.slice(0, 400), stack });
  if (sess.errors.length > 12) sess.errors.shift();
  note('error', where);
}

/* page life cycle: tells a killed background tab from a crash in front */
document.addEventListener('visibilitychange', () => note('visibility', document.visibilityState));
window.addEventListener('pagehide', e => note('pagehide', { persisted: !!e.persisted }));
window.addEventListener('pageshow', e => note('pageshow', { persisted: !!e.persisted }));
document.addEventListener('freeze', () => note('freeze'));
document.addEventListener('resume', () => note('resume'));
window.addEventListener('error', e => fail('window', e.error || e.message));
window.addEventListener('unhandledrejection', e => fail('promise', e.reason));

/* heartbeat: once a second while a run is going */
let beatTimer = null, beatN = 0, lastActivity = 0, stallNoted = false;

function startBeat() {
  stopBeat();
  beatN = 0; lastActivity = Date.now(); stallNoted = false;
  beatTimer = setInterval(() => {
    const now = Date.now();
    sess.beat = now;
    if (beatN++ % 5 === 0) {                       // a memory sample every 5 s
      const h = heapMB();
      if (h) { sess.mem.push({ t: now, used: h.used, limit: h.limit }); if (sess.mem.length > 60) sess.mem.shift(); }
    }
    if (!stallNoted && sess.stage === 'encode' && now - lastActivity > STALL_SECONDS * 1000) {
      stallNoted = true;
      note('stall', { idleSec: Math.round((now - lastActivity) / 1000) });
      setStatus(t('stalled'), true);
    }
    save();
  }, 1000);
}
function stopBeat() { if (beatTimer) { clearInterval(beatTimer); beatTimer = null; } }

function blackboxOn(stageName) { sess.running = true; stage(stageName); startBeat(); }
function blackboxOff(outcome) { stopBeat(); sess.running = false; stage(outcome); }

/* rough memory estimate; it is written to the report so the numbers can be tuned */
function estimateMemory() {
  if (!state.file) return null;
  const fileMB = state.file.size / 1048576;
  const known = state.srcW > 0 && state.srcH > 0;
  const up = known && S.height > state.srcH ? S.height / state.srcH : 1;
  const frameMB = known ? state.srcW * up * state.srcH * up * 1.5 / 1048576 : 6;
  const held = { ultrafast: 6, veryfast: 14, fast: 20 }[speed] || 14;
  const extra = 4 + (S.fps ? (S.interp === 'motion' ? 12 : 4) : 0) + (S.deflicker ? 6 : 0);
  const outMB = Math.max(fileMB, 5) * up;
  const wasmMB = fileMB + outMB + (held + extra) * frameMB + 60;  // files in memory + frames + engine
  const jsMB = fileMB + outMB * 2;                                // upload copy, read-back copy, blob
  const totalMB = wasmMB + jsMB;
  const limit = isMobile() ? 600 : 1800;
  const r = Math.round;
  return { fileMB: r(fileMB), outMB: r(outMB), frameMB: r(frameMB * 10) / 10,
           frames: held + extra, wasmMB: r(wasmMB), jsMB: r(jsMB), totalMB: r(totalMB),
           limit, warn: totalMB > limit };
}

function quickChecks() {
  const items = [];
  const add = (level, label, detail) => items.push({ level, label, detail: detail || '' });
  add(typeof WebAssembly === 'object' ? 'ok' : 'fail', 'WebAssembly');
  add(typeof Worker === 'function' ? 'ok' : 'fail', 'Web Workers');
  const stored = lsSet('enhancer-probe', 1) && lsGet('enhancer-probe') === 1;
  lsDel('enhancer-probe');
  add(stored ? 'ok' : 'warn', 'Storage', stored ? '' : 'a crash report cannot be saved');
  add(location.protocol === 'file:' ? 'warn' : 'ok', 'Page',
      location.protocol === 'file:' ? 'opened from a file, the web link works better'
                                    : location.protocol.replace(':', ''));
  const env = sess.env;
  add('info', 'Device', `${env.mobile ? 'mobile' : 'desktop'}, ${env.cores || '?'} cores, ` +
      (env.deviceMemoryGB ? env.deviceMemoryGB + ' GB RAM' : 'RAM unknown'));
  const h = heapMB();
  if (h) add('info', 'JS heap', `${h.used} of ${h.limit} MB`);
  add(navigator.onLine || ffmpeg ? 'ok' : 'warn', 'Network', navigator.onLine ? 'online' : 'offline');
  const est = estimateMemory();
  if (est) add(est.warn ? 'warn' : 'ok', 'Memory estimate',
      `about ${est.totalMB} MB for this job (limit used: ${est.limit} MB)`);
  return { items, est };
}

function renderChecks(items) {
  const tag = { ok: 'OK', warn: 'WARN', fail: 'FAIL', info: 'INFO' };
  return items.map(i => `${tag[i.level].padEnd(5)} ${i.label}${i.detail ? ': ' + i.detail : ''}`).join('\n');
}

// Encodes 10 tiny raw frames through the current filter chain, so a missing
// filter or a broken encoder shows up here and not on a big file.
async function miniEncode(eng) {
  const w = 160, h = 90, n = 10, fsz = w * h * 3 / 2;
  const raw = new Uint8Array(fsz * n);
  for (let f = 0; f < n; f++) {
    const o = f * fsz;
    for (let i = 0; i < w * h; i++) raw[o + i] = ((i % w) * 2 + f * 12) & 255;
    raw.fill(128, o + w * h, o + fsz);
  }
  const chain = buildFilters(Object.assign({}, S, { height: 0 }), h);
  await eng.writeFile('probe.yuv', raw);
  const t0 = performance.now();
  let code = -1, size = 0;
  try {
    code = await eng.exec(['-f', 'rawvideo', '-pixel_format', 'yuv420p', '-video_size', `${w}x${h}`,
      '-framerate', '10', '-i', 'probe.yuv', '-vf', chain.join(','), '-c:v', 'libx264',
      '-preset', 'ultrafast', '-crf', '28', 'probe.mp4']);
    if (code === 0) size = (await eng.readFile('probe.mp4')).length;
  } finally {
    for (const f of ['probe.yuv', 'probe.mp4']) { try { await eng.deleteFile(f); } catch (e) { /* ignore */ } }
  }
  return { code, size, ms: Math.round(performance.now() - t0),
           chain: chain.map(x => x.split('=')[0]).join(' ') };
}

function setDiag(msg) { $('diagOut').textContent = msg; }

async function selfCheck() {
  if (state.running || sess.running) return;
  setDiag(t('dgChecking'));
  const { items } = quickChecks();
  const add = (level, label, detail) => items.push({ level, label, detail: detail || '' });
  const first = e => String((e && e.message) || e).split('\n')[0].slice(0, 120);
  blackboxOn('selfcheck');
  let eng = null;
  try {
    const t0 = performance.now();
    stage('selfcheck:engine');
    eng = await ensureEngine();
    add('ok', 'Engine', `loaded in ${Math.round(performance.now() - t0)} ms`);
  } catch (e) {
    fail('selfcheck:engine', e);
    add('fail', 'Engine', first(e));
  }
  if (eng) {
    try {
      sess.ff = [];
      stage('selfcheck:version');
      await eng.exec(['-version']);
      const ver = sess.ff.find(l => /^ffmpeg version/.test(l));
      add(ver ? 'ok' : 'warn', 'ffmpeg', ver ? ver.slice(0, 40) : 'no version line');
    } catch (e) { fail('selfcheck:version', e); add('fail', 'ffmpeg', first(e)); }
    try {
      stage('selfcheck:encode');
      const r = await miniEncode(eng);
      add(r.code === 0 && r.size > 0 ? 'ok' : 'fail', 'Mini encode',
          r.code === 0 ? `${r.size} bytes in ${r.ms} ms (${r.chain})` : `exit ${r.code}, see the log in the report`);
    } catch (e) { fail('selfcheck:encode', e); add('fail', 'Mini encode', first(e)); }
  }
  blackboxOff('selfcheck-end');
  sess.selfCheck = { t: Date.now(), items };
  save();
  setDiag(renderChecks(items));
}

/* ---------- the report ---------- */
const W = 58;   // narrow lines, so the file reads well on a phone

function kv(key, val, pad = 13) {
  const s = String(val === undefined || val === null || val === '' ? '-' : val);
  const room = W - pad, out = [];
  for (let i = 0; i === 0 || i < s.length; i += room) {
    out.push((i === 0 ? (key + ':').padEnd(pad) : ' '.repeat(pad)) + s.slice(i, i + room));
  }
  return out.join('\n');
}

function chunk(s, indent = 2) {
  const room = W - indent, out = [];
  for (let i = 0; i === 0 || i < s.length; i += room) out.push(' '.repeat(indent) + s.slice(i, i + room));
  return out.join('\n');
}

const clock = ms => new Date(ms).toISOString().replace('T', ' ').slice(0, 19) + 'Z';

function verdict(d) {
  const out = [];
  const ev = d.events || [];
  const run = d.run || {};
  const during = ev.filter(e => e.t >= (run.t0 || 0));
  if (d.running) {
    if (during.some(e => e.k === 'pagehide')) out.push('The page was closed or reloaded while it was working.');
    else if (during.some(e => e.k === 'visibility' && e.d === 'hidden')) {
      out.push('The tab went into the background while it was working. Phones often kill background tabs. Keep the screen on and the tab open.');
    } else out.push('The tab died while it was in front. That almost always means it ran out of memory.');
    out.push(`It stopped at "${d.stage}" (${d.progress} %).`);
  }
  if (during.some(e => e.k === 'stall')) out.push(`No activity for ${STALL_SECONDS} s: the encoder was probably stuck.`);
  const logs = (d.ff || []).join(' ');
  if (/out of memory|memory access out of bounds|abort|cannot allocate/i.test(logs)) out.push('ffmpeg reported a memory problem.');
  if (/No such filter|Unknown encoder|Error initializing filter/i.test(logs)) out.push('A filter or encoder is missing from this ffmpeg.wasm build, see the log.');
  if (run.est && run.est.warn) out.push(`The memory estimate was high (${run.est.totalMB} MB, limit used ${run.est.limit} MB).`);
  if ((d.errors || []).length) out.push(`${d.errors.length} error(s) were recorded, see ERRORS.`);
  if (!out.length) out.push('Nothing wrong was recorded.');
  return out;
}

function sessionText(d, title, withDevice = true) {
  const t0 = (d.run && d.run.t0) || d.started;
  const rel = ms => (ms < t0 ? '-' : '+') + (Math.abs(ms - t0) / 1000).toFixed(1) + 's';
  const L = [`--- ${title} ---`];
  L.push(kv('Started', clock(d.started)));
  L.push(kv('Version', d.v));
  L.push(kv('Running', d.running ? 'YES, it never finished' : 'no'));
  L.push(kv('Stage', d.stage));
  L.push(kv('Progress', d.progress + ' %'));
  if (d.beat) L.push(kv('Last beat', rel(d.beat)));
  L.push('', 'VERDICT');
  verdict(d).forEach(v => L.push(chunk('- ' + v, 0)));

  const e = d.env || {};
  if (withDevice) {
    L.push('', 'DEVICE');
    L.push(kv('System', e.platform), kv('Mobile', e.mobile ? 'yes' : 'no'));
    L.push(kv('CPU cores', e.cores), kv('RAM (GB)', e.deviceMemoryGB || 'unknown'));
    L.push(kv('Screen', e.screen), kv('Network', `${e.online ? 'online' : 'offline'} ${e.net || ''}`));
    L.push(kv('Wasm/Worker', `${e.wasm ? 'yes' : 'NO'} / ${e.worker ? 'yes' : 'NO'}`));
    L.push(kv('Threads', `SharedArrayBuffer ${e.sab ? 'yes' : 'no'}, isolated ${e.isolated ? 'yes' : 'no'}`));
    L.push(kv('Browser', e.ua));
  }

  const r = d.run;
  if (r) {
    const f = r.file || {};
    L.push('', 'FILE (name is not recorded)');
    L.push(kv('Type', `${f.ext} ${f.type}`), kv('Size', `${f.mb} MB`));
    L.push(kv('Video', `${f.w}x${f.h}, ${f.sec === null ? '?' : f.sec + ' s'}`));
    L.push('', 'SETTINGS (changed ones)');
    const changed = Object.entries(r.settings || {}).filter(([k, v]) => v !== DEFAULTS[k]);
    L.push(chunk(changed.map(([k, v]) => `${k}=${v}`).join(' ') || '(defaults)'));
    L.push(kv('Speed', r.speed));
    if (r.est) {
      L.push('', 'MEMORY ESTIMATE (rough)');
      L.push(kv('Wasm side', `${r.est.wasmMB} MB`), kv('JS side', `${r.est.jsMB} MB`));
      L.push(kv('Total', `${r.est.totalMB} MB, limit used ${r.est.limit} MB`));
      L.push(kv('Frames', `${r.est.frames} held, ${r.est.frameMB} MB each`));
    }
    if (r.args) { L.push('', 'FFMPEG ARGS', chunk(r.args)); }
  }

  const ev = (d.events || []).slice(-40);
  L.push('', 'TIMELINE');
  ev.forEach(x => L.push(chunk(`${rel(x.t)}  ${x.k}${x.d !== undefined ? ' ' + JSON.stringify(x.d) : ''}`, 1)));

  if ((d.mem || []).length) {
    const m = d.mem.slice(-12);
    L.push('', 'JS HEAP (MB used / limit)');
    m.forEach(x => L.push(`  ${rel(x.t).padEnd(9)} ${x.used} / ${x.limit}`));
    L.push(kv('Peak', Math.max(...d.mem.map(x => x.used)) + ' MB'));
  }

  if ((d.ff || []).length) {
    L.push('', 'FFMPEG LOG (last lines)');
    d.ff.slice(-25).forEach(x => L.push(chunk(x, 2)));
  }

  if ((d.errors || []).length) {
    L.push('', 'ERRORS');
    d.errors.forEach(x => {
      L.push(chunk(`${rel(x.t)} ${x.where}: ${x.msg}`, 1));
      if (x.stack) x.stack.split('\n').forEach(s => L.push(chunk(s.trim(), 3)));
    });
  }

  if (d.selfCheck) {
    L.push('', `SELF-CHECK (${clock(d.selfCheck.t)})`);
    renderChecks(d.selfCheck.items).split('\n').forEach(x => L.push(chunk(x, 1)));
  }
  return L.join('\n');
}

function buildReport() {
  const L = ['ENHANCER CRASHREPORT', '===================='];
  L.push(kv('Created', clock(Date.now())));
  L.push(kv('App', `Enhancer ${APP_VERSION} (browser)`));
  L.push(kv('Page', sess.env.page));
  L.push(kv('Engine', `ffmpeg.wasm ${VER.ffmpeg}, core ${VER.core}`));
  L.push(kv('Privacy', 'no file names, nothing is sent anywhere'), '');
  const old = lsGet(KEY_CRASH);
  if (old) L.push(sessionText(old, 'PREVIOUS SESSION (ended unexpectedly)'), '');
  L.push(sessionText(sess, 'THIS SESSION', !old));
  return L.join('\n') + '\n';
}

function downloadReport() {
  const blob = new Blob([buildReport()], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'CRASHREPORT.txt';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function copyReport() {
  const text = buildReport();
  let done = false;
  try { await navigator.clipboard.writeText(text); done = true; } catch (e) { /* try the fallback */ }
  if (!done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { done = document.execCommand('copy'); } catch (e) { /* ignore */ }
    ta.remove();
  }
  setDiag(done ? t('dgCopied') : t('dgCopyFail'));
}

function showCrash() {
  const box = $('crash');
  if (!crashed) { box.style.display = 'none'; return; }
  $('crashBody').textContent = t('crashBody')
    .replace('{stage}', crashed.stage || '?').replace('{pct}', crashed.progress || 0);
  box.style.display = 'block';
}

function clearAll() { clearCrash(); setDiag(t('dgCleared')); }

function clearCrash() { lsDel(KEY_CRASH); crashed = null; showCrash(); }


/* ---------- filter chain (same order and maths as enhancer.py) ---------- */
function buildFilters(s, srcH) {
  const c = [];
  if (s.deflicker) c.push('deflicker=size=5:mode=am');
  if (s.denoise > 0) {
    const d = clamp(s.denoise, 0, 10);
    c.push(`hqdn3d=${d.toFixed(2)}:${(d * 0.75).toFixed(2)}:${(d * 1.5).toFixed(2)}:${(d * 1.1).toFixed(2)}`);
  }
  if (s.deband) c.push('deband=1thr=0.02:2thr=0.02:3thr=0.02:blur=1');
  if (s.fps > 0) {
    c.push(s.interp === 'motion'
      ? `minterpolate=fps=${s.fps}:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1`
      : `minterpolate=fps=${s.fps}:mi_mode=blend`);
  }
  if (s.height && srcH && s.height > srcH) c.push(`scale=-2:${s.height}:flags=lanczos`);
  // The browser could not read the size (some codecs): let ffmpeg decide, still never scaling down.
  else if (s.height && !srcH) c.push(`scale=-2:max(ih\\,${s.height}):flags=lanczos`);
  if (s.sharpen > 0) c.push(`unsharp=5:5:${clamp(s.sharpen, 0, 2).toFixed(2)}:5:5:0`);
  const eq = [];
  if (s.contrast)   eq.push(`contrast=${(1 + s.contrast / 200).toFixed(3)}`);
  if (s.brightness) eq.push(`brightness=${(s.brightness / 500).toFixed(3)}`);
  if (s.saturation) eq.push(`saturation=${(1 + s.saturation / 100).toFixed(3)}`);
  if (eq.length) c.push('eq=' + eq.join(':'));
  if (s.vibrance) c.push(`vibrance=intensity=${(s.vibrance / 100).toFixed(3)}`);
  if (s.warmth) {
    const a = s.warmth / 100 * 0.25;
    const f = x => x.toFixed(3);
    c.push(`colorbalance=rs=${f(a)}:rm=${f(a)}:rh=${f(a)}:bs=${f(-a)}:bm=${f(-a)}:bh=${f(-a)}`);
  }
  if (s.grain > 0) c.push(`noise=alls=${Math.round(clamp(s.grain, 0, 40))}:allf=t`);
  c.push('format=yuv420p');
  return c;
}

/* ---------- live preview (approximation of the colour part) ---------- */
function makeGrainTile() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  const img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return cv.toDataURL('image/png');
}

function applyPreview() {
  const parts = [];
  if (S.sharpen > 0) {
    const a = S.sharpen * 0.9;
    $('kernel').setAttribute('kernelMatrix',
      `0 ${-a} 0 ${-a} ${1 + 4 * a} ${-a} 0 ${-a} 0`);
    parts.push('url(#sharpen)');
  }
  parts.push(`contrast(${1 + S.contrast / 200})`);
  parts.push(`brightness(${1 + S.brightness / 250})`);
  parts.push(`saturate(${Math.max(0, 1 + S.saturation / 100 + S.vibrance / 300)})`);
  $('vid').style.filter = parts.join(' ');

  const warm = $('warmFx');
  warm.style.background = S.warmth >= 0 ? 'rgb(255,140,40)' : 'rgb(60,130,255)';
  warm.style.opacity = String(Math.abs(S.warmth) / 100 * 0.45);
  $('grainFx').style.opacity = String(S.grain / 40 * 0.35);
}

/* ---------- UI building ---------- */
function chipRow(host, items, getVal, onPick, label) {
  host.textContent = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (getVal() === it.value ? ' on' : '');
    b.textContent = label(it);
    b.addEventListener('click', () => { onPick(it.value); renderChips(); });
    host.appendChild(b);
  });
}

function renderChips() {
  chipRow($('heightChips'), HEIGHTS.map(v => ({ value: v })),
    () => S.height, v => { S.height = v; },
    it => it.value ? `${it.value}p` : t('keep'));
  chipRow($('fpsChips'), FPS.map(v => ({ value: v })),
    () => S.fps, v => { S.fps = v; updateInterp(); },
    it => it.value ? `${it.value} fps` : t('keep'));
  chipRow($('interpChips'), ['blend', 'motion'].map(v => ({ value: v })),
    () => S.interp, v => { S.interp = v; updateInterp(); },
    it => t(it.value));
  chipRow($('speedChips'), SPEEDS.map(([k, v]) => ({ value: v, key: k })),
    () => speed, v => { speed = v; },
    it => t(it.key));
  const host = $('presets');
  host.textContent = '';
  Object.keys(PRESETS).forEach(k => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip pre';
    b.textContent = t(k);
    b.addEventListener('click', () => {
      Object.assign(S, DEFAULTS, PRESETS[k]);
      syncControls(); renderChips(); applyPreview();
    });
    host.appendChild(b);
  });
  updateInterp();
}

function updateInterp() {
  $('interpRow').style.display = S.fps ? '' : 'none';
}

const sliderEls = {};
function buildSliders() {
  Object.entries(SLIDERS).forEach(([hostId, list]) => {
    const host = $(hostId);
    host.textContent = '';
    list.forEach(([key, min, max, step]) => {
      const row = document.createElement('div');
      row.className = 'row';
      const lab = document.createElement('label');
      const name = document.createElement('span');
      name.dataset.i18n = key;
      const out = document.createElement('output');
      lab.append(name, out);
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step;
      inp.value = S[key];
      const show = () => { out.textContent = Number(inp.value).toString(); };
      inp.addEventListener('input', () => {
        S[key] = Number(inp.value); show(); applyPreview();
      });
      show();
      row.append(lab, inp);
      host.appendChild(row);
      sliderEls[key] = { inp, show };
    });
  });
  const tg = $('tClean');
  tg.textContent = '';
  ['deflicker', 'deband'].forEach(key => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.i18n = key;
    b.className = 'chip' + (S[key] ? ' on' : '');
    b.addEventListener('click', () => {
      S[key] = !S[key]; b.classList.toggle('on', S[key]);
    });
    tg.appendChild(b);
  });
}

function syncControls() {
  Object.entries(sliderEls).forEach(([k, { inp, show }]) => {
    inp.value = S[k]; show();
  });
  document.querySelectorAll('#tClean .chip').forEach(b => {
    b.classList.toggle('on', !!S[b.dataset.i18n]);
  });
}

/* ---------- language ---------- */
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-lang]').forEach(b =>
    b.classList.toggle('on', b.dataset.lang === l));
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  showCrash();
  renderChips();
  try { localStorage.setItem('enhancer-lang', l); } catch (e) { /* ignore */ }
}

/* ---------- file handling ---------- */
function fmtTime(sec) {
  if (!isFinite(sec)) return '';
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function loadFile(f) {
  if (!f) return;
  if (f.size > 700 * 1024 * 1024) { setStatus(t('errBig'), true); return; }
  state.file = f;
  if (state.url) URL.revokeObjectURL(state.url);
  state.url = URL.createObjectURL(f);
  const v = $('vid');
  v.src = state.url;
  v.onloadedmetadata = () => {
    state.srcW = v.videoWidth; state.srcH = v.videoHeight;
    $('meta').textContent =
      `${f.name} · ${v.videoWidth}×${v.videoHeight} · ${fmtTime(v.duration)} · ${(f.size / 1048576).toFixed(1)} MB`;
  };
  v.onerror = () => {
    state.srcW = state.srcH = 0;
    $('meta').textContent = f.name;
  };
  $('stage').style.display = 'block';
  $('result').style.display = 'none';
  setStatus('');
  applyPreview();
  v.play().catch(() => {});
}

function setStatus(msg, err) {
  const s = $('status');
  s.textContent = msg;
  s.classList.toggle('err', !!err);
}

/* ---------- ffmpeg.wasm ---------- */
const CDNS = [
  'https://unpkg.com',
  'https://cdn.jsdelivr.net/npm'
];
const VER = { ffmpeg: '0.12.10', util: '0.12.1', core: '0.12.6' };
let ffmpeg = null, loading = null;

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('script ' + src));
    document.head.appendChild(s);
  });
}

// The worker script is a numbered chunk (814.ffmpeg.js in the versions we
// know). Read its real name from ffmpeg.js itself so a rename cannot break us.
async function findWorkerChunk(pkg) {
  try {
    const txt = await (await fetch(`${pkg}/ffmpeg.js`)).text();
    const m = txt.match(/\.u\((\d+)\)/) || txt.match(/(\d+)\.ffmpeg\.js/);
    if (m) return `${m[1]}.ffmpeg.js`;
  } catch (e) { /* fall back to the known name */ }
  return '814.ffmpeg.js';
}

// A worker made from a blob (classWorkerURL) runs as a module worker, and a
// module worker cannot importScripts() the UMD core. It needs the ESM core, so
// that goes first; the UMD core stays as a fallback.
const CORE_FLAVOURS = ['esm', 'umd'];

async function bootEngine() {
  const problems = [];
  for (const base of CDNS) {
    for (const flavour of CORE_FLAVOURS) {
      let step = 'ffmpeg.js';
      let inst = null;
      try {
        if (!window.FFmpegWASM) await loadScript(`${base}/@ffmpeg/ffmpeg@${VER.ffmpeg}/dist/umd/ffmpeg.js`);
        step = 'util.js';
        if (!window.FFmpegUtil) await loadScript(`${base}/@ffmpeg/util@${VER.util}/dist/umd/index.js`);
        const { toBlobURL } = window.FFmpegUtil;
        const pkg = `${base}/@ffmpeg/ffmpeg@${VER.ffmpeg}/dist/umd`;
        const core = `${base}/@ffmpeg/core@${VER.core}/dist/${flavour}`;
        step = 'worker name';
        const chunk = await findWorkerChunk(pkg);
        step = 'ffmpeg-core.js';
        const coreURL = await toBlobURL(`${core}/ffmpeg-core.js`, 'text/javascript');
        step = 'ffmpeg-core.wasm';
        const wasmURL = await toBlobURL(`${core}/ffmpeg-core.wasm`, 'application/wasm');
        step = chunk;
        const classWorkerURL = await toBlobURL(`${pkg}/${chunk}`, 'text/javascript');
        step = 'start';
        inst = new window.FFmpegWASM.FFmpeg();
        await inst.load({ coreURL, wasmURL, classWorkerURL });
        return inst;
      } catch (e) {
        console.error('Enhancer engine', base, flavour, step, e);
        if (inst) { try { inst.terminate(); } catch (e2) { /* ignore */ } }
        const host = base.replace(/^https?:\/\//, '').split('/')[0];
        problems.push(`${host} ${flavour}: ${step}: ${(e && e.message) || e}`);
      }
    }
  }
  throw new Error(problems.join('\n'));
}

async function ensureEngine() {
  if (ffmpeg) return ffmpeg;
  if (!loading) {
    const t0 = performance.now();
    loading = bootEngine().then(inst => {
      // Registered once per engine, so repeated runs do not stack listeners.
      inst.on('log', ({ message }) => {
        tail.push(message); tail = tail.slice(-8);
        sess.ff.push(String(message).slice(0, 160));
        if (sess.ff.length > 60) sess.ff.shift();
        lastActivity = Date.now();
      });
      inst.on('progress', ({ progress }) => {
        lastActivity = Date.now();
        const pct = clamp(progress * 100, 0, 100);
        sess.progress = Math.round(pct);
        $('bar').style.width = pct.toFixed(1) + '%';
      });
      note('engine-ready', { ms: Math.round(performance.now() - t0) });
      ffmpeg = inst;
      return inst;
    }).finally(() => { loading = null; });
  }
  return loading;
}

/* ---------- run ---------- */
let tail = [];

function preflight() {
  const q = quickChecks();
  const bad = q.items.find(i => i.level === 'fail');
  return { est: q.est, blocker: bad ? t('noWasm') : null };
}

async function run() {
  if (!state.file) { setStatus(t('errNoFile'), true); return; }
  if (state.running || sess.running) return;
  const pre = preflight();
  if (pre.blocker) { setStatus(pre.blocker, true); return; }

  state.running = true;
  $('run').disabled = true;
  $('cancel').style.display = '';
  $('result').style.display = 'none';
  $('prog').style.display = 'block';
  $('bar').style.width = '0';
  setStatus(t('loadEngine'));

  const notes = [];
  if (S.height && state.srcH && S.height <= state.srcH) notes.push(t('onlyUp'));
  if (S.fps && S.interp === 'motion') notes.push(t('slowInterp'));
  if (pre.est && pre.est.warn) notes.push(t('heavy').replace('{mb}', pre.est.totalMB));

  const f = state.file, v = $('vid');
  const ext = (f.name.match(/\.[a-z0-9]+$/i) || ['.mp4'])[0].toLowerCase();
  sess.run = {
    t0: Date.now(),
    file: { ext, mb: Math.round(f.size / 104857.6) / 10, type: f.type || '?',
            w: state.srcW, h: state.srcH,
            sec: isFinite(v.duration) ? Math.round(v.duration * 10) / 10 : null },
    settings: Object.assign({}, S), speed, est: pre.est, vf: null, args: null
  };
  sess.ff = []; sess.mem = []; sess.progress = 0;
  blackboxOn('engine-load');

  let ok = false;
  try {
    let eng;
    try { eng = await ensureEngine(); }
    catch (e) {
      fail('engine', e);
      setStatus(t('errEngine') + '\n' + e.message + '\n' + t('reportHint'), true);
      return;
    }

    setStatus([t('working')].concat(notes).join('  '));
    stage('write-input');
    const inName = 'input' + ext;
    await eng.writeFile(inName, new Uint8Array(await f.arrayBuffer()));

    const vf = buildFilters(S, state.srcH).join(',');
    const base = ['-i', inName, '-vf', vf, '-c:v', 'libx264', '-crf', String(S.crf),
      '-preset', speed];
    if (SPEED_PARAMS[speed]) base.push('-x264-params', SPEED_PARAMS[speed]);
    base.push('-movflags', '+faststart');
    sess.run.vf = vf;
    sess.run.args = base.join(' ');

    stage('encode');
    lastActivity = Date.now();
    tail = [];
    let code = await eng.exec([...base, '-c:a', 'copy', 'out.mp4']);
    note('exec', { code });
    // Retry with re-encoded audio only for an ordinary error, never after the
    // engine itself ran out of memory and aborted.
    const aborted = /abort|memory|OOM|out of bounds/i.test(tail.join(' '));
    if (code !== 0 && state.running && !aborted) {
      note('retry-audio');
      code = await eng.exec([...base, '-c:a', 'aac', '-b:a', '320k', 'out.mp4']);
      note('exec', { code });
    }
    if (code !== 0) throw new Error('ffmpeg exit ' + code);

    stage('read-output');
    const data = await eng.readFile('out.mp4');
    const blob = new Blob([data.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    const out = $('out');
    if (out.dataset.url) URL.revokeObjectURL(out.dataset.url);
    out.dataset.url = url;
    out.src = url;
    const dl = $('dl');
    dl.href = url;
    dl.download = f.name.replace(/\.[^.]+$/, '') + '_enhanced.mp4';
    $('result').style.display = 'block';
    $('bar').style.width = '100%';
    setStatus(t('done'));
    ok = true;
    try { await eng.deleteFile(inName); await eng.deleteFile('out.mp4'); } catch (e) { /* ignore */ }
    $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (e) {
    if (state.running) {
      fail('run', e);
      setStatus(t('errFail') + '\n' + t('reportHint'), true);
      // A crashed engine cannot be reused: drop it so the next try starts clean.
      if (ffmpeg) { try { ffmpeg.terminate(); } catch (e2) { /* ignore */ } ffmpeg = null; }
    }
  } finally {
    blackboxOff(ok ? 'done' : (state.running ? 'failed' : 'cancelled'));
    state.running = false;
    $('run').disabled = false;
    $('cancel').style.display = 'none';
    if (!ok) $('prog').style.display = 'none';
  }
}

function cancel() {
  if (!state.running) return;
  state.running = false;
  note('cancel');
  if (ffmpeg) { try { ffmpeg.terminate(); } catch (e) { /* ignore */ } ffmpeg = null; }
  setStatus(t('cancelled'));
}

/* ---------- reset: settings, speed, status, progress and result ---------- */
function resetAll() {
  if (state.running) cancel();
  Object.assign(S, DEFAULTS);
  speed = 'veryfast';
  syncControls(); renderChips(); applyPreview();
  setStatus('');
  $('prog').style.display = 'none';
  $('bar').style.width = '0';
  const out = $('out');
  if (out.dataset.url) { URL.revokeObjectURL(out.dataset.url); delete out.dataset.url; }
  out.removeAttribute('src');
  out.load();
  $('result').style.display = 'none';
  $('run').disabled = false;
}

/* ---------- wiring ---------- */
function init() {
  $('warmFx').style.opacity = '0';
  $('grainFx').style.backgroundImage = `url(${makeGrainTile()})`;
  buildSliders();

  document.querySelectorAll('[data-lang]').forEach(b =>
    b.addEventListener('click', () => setLang(b.dataset.lang)));

  let saved = null;
  try { saved = localStorage.getItem('enhancer-lang'); } catch (e) { /* ignore */ }
  setLang(saved || ((navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en'));

  const drop = $('drop');
  $('file').addEventListener('change', e => {
    loadFile(e.target.files[0]);
    e.target.value = '';  // lets you pick the same file again
  });
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove('over');
  }));
  drop.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

  const hold = $('hold'), player = $('player');
  const on = e => { e.preventDefault(); player.classList.add('orig'); };
  const off = () => player.classList.remove('orig');
  hold.addEventListener('pointerdown', on);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => hold.addEventListener(ev, off));

  $('reset').addEventListener('click', resetAll);
  $('run').addEventListener('click', run);
  $('cancel').addEventListener('click', cancel);

  $('dgCheck').addEventListener('click', selfCheck);
  $('dgSave').addEventListener('click', downloadReport);
  $('dgCopy').addEventListener('click', copyReport);
  $('dgClear').addEventListener('click', clearAll);
  $('crashSave').addEventListener('click', () => { downloadReport(); clearCrash(); });
  $('crashHide').addEventListener('click', clearCrash);

  const nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || null;
  note('load', { nav: nav ? nav.type : '?', previousRunUnfinished: !!(prevSess && prevSess.running) });
  showCrash();
  applyPreview();
}
init();
</script>
</body>
</html>
